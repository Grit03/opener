name: 📝 Documentation
description: A README, a setup step, or a comment in this repo that is missing, wrong, or confusing
title: '[Docs] '
labels: ['documentation']
body:
    - type: input
      id: location
      attributes:
          label: Where?
          description: The file path in this repo. If it lives somewhere else, link it.
          placeholder: apps/extension/README.md
      validations:
          required: true
    - type: textarea
      id: problem
      attributes:
          label: What is wrong or missing?
          description: What did you expect to find, and what did you find instead? Commands that no longer work or steps that skip something are especially useful.
      validations:
          required: true
    - type: textarea
      id: suggestion
      attributes:
          label: Suggested wording or fix
      validations:
          required: false
