glob_matcher: doublestar

pre-commit:
  parallel: true
  commands:
    format:
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    lint-web:
      root: apps/web/
      glob: "apps/web/**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec eslint {staged_files}
    lint-extension:
      root: apps/extension/
      glob: "apps/extension/**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      run: pnpm exec eslint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit "{1}"

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
