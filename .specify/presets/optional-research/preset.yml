schema_version: "1.0"

preset:
  id: "optional-research"
  name: "Optional Research"
  version: "1.0.0"
  description: "Lean plan에 선택적인 research.md 작성을 추가한다."

requires:
  speckit_version: ">=0.6.0"

provides:
  templates:
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "요청할 때만 research.md를 작성한다."
      strategy: "append"
