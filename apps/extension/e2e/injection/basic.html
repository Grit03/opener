<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opener E2E</title>
  </head>
  <body>
    <main id="scroller" style="height: 160px; overflow: auto">
      <h1>Opener E2E page</h1>
      <div id="narrow" style="width: 200px">
        <p id="first" style="overflow-wrap: anywhere">
          The first paragraph is visible.
          https://example.com/this-is-a-very-long-url-without-any-natural-break-points
        </p>
      </div>
      <div style="height: 400px"></div>
      <p id="second">The second paragraph appears after scrolling.</p>
    </main>
  </body>
</html>
